<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Gridiron Legends</title>
<style>
html,body{margin:0;height:100%;background:#0d1f0d;color:#fff;font-family:"Courier New",monospace;overflow:hidden;touch-action:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}
#g{position:relative;height:min(100vh,150vw);aspect-ratio:2/3}
canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.p{pointer-events:auto;background:#10240fee;border:3px solid #f5c400;padding:14px 16px;max-width:84%;text-align:center;font-size:clamp(11px,2.6vh,15px);line-height:1.5}
.p h2{margin:0 0 6px;color:#f5c400;letter-spacing:1px}
button{font:inherit;font-weight:bold;background:#f5c400;color:#10240f;border:0;padding:7px 11px;margin:3px;cursor:pointer}
button:disabled{background:#4a5a49;color:#8a9a89}
#jk{position:absolute;right:8px;bottom:22px;display:none;padding:14px 18px;background:#3a9bff;color:#fff}
</style></head><body>
<div id="g"><canvas id="c" width="240" height="360"></canvas><div id="ov"></div><button id="jk">JUKE</button></div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),OV=document.getElementById('ov'),JK=document.getElementById('jk');
const W=240,H=360,YD=8,FL=960,GOAL=80,R=Math.random,cl=(v,a,b)=>Math.max(a,Math.min(b,v)),wy=y=>(110-y)*YD;
const TEAMS=['Rhinos','Comets','Vipers','Titans','Bears','Hawks','Sharks','Wolves'];
const UPN={qb:'QB ARM',wr:'RECEIVERS',df:'DEFENSE',kk:'KICKER'};
let S;try{S=JSON.parse(localStorage.getItem('gl1'))}catch(e){}
S=S||{wk:0,w:0,l:0,cr:3,up:{qb:0,wr:0,df:0,kk:0}};
const save=()=>{try{localStorage.setItem('gl1',JSON.stringify(S))}catch(e){}};
let G=null,keys={},ptr={sx:120,sy:0,x:120,y:0,d:false},last=0,AC;
const oppLv=()=>1+Math.floor(S.wk/2);
function beep(f,d=.08){try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}

/* ---------- menus ---------- */
function hub(extra=''){
  G=null;
  OV.innerHTML=`<div class=p><h2>GRIDIRON LEGENDS</h2>${extra}Week ${S.wk+1}/8 &nbsp; Record ${S.w}-${S.l} &nbsp; Credits ${S.cr}<br>Next: vs ${TEAMS[S.wk%8]} (rating ${oppLv()})<br><br>`+
  Object.keys(UPN).map(k=>{const c=2+2*S.up[k],mx=S.up[k]>=5;return `<button ${mx||S.cr<c?'disabled':''} onclick="UP('${k}')">${UPN[k]} L${S.up[k]}${mx?' MAX':' ('+c+')'}</button>`}).join('')+
  `<br><br><button onclick="newGame()">PLAY GAME</button><br><small>Arrows/WASD or drag: move &middot; Tap receiver or 1-2-3: throw &middot; Space: snap/juke</small></div>`}
function UP(k){const c=2+2*S.up[k];if(S.up[k]<5&&S.cr>=c){S.cr-=c;S.up[k]++;save();hub()}}

/* ---------- game flow ---------- */
function newGame(){OV.innerHTML='';G={me:0,op:0,o:oppLv(),q:1,clock:75,down:1,toGo:10,yl:25,msg:'KICKOFF',cam:0};setup();G.cam=cl(G.qb.y-250,0,FL-H)}
function mkRoute(x,y,s){const k=Math.floor(R()*5);
  const P=[[[0,-240]],[[0,-70],[-s*60,-70],[-s*60,-240]],[[s*40,-50],[s*70,-240]],[[0,-90],[s*55,-240]],[[0,-80],[0,-62]]][k];
  return{x,y,i:0,stop:k==4,wp:P.map(([a,b])=>[cl(x+a,20,220),y+b])}}
function setup(){
  G.toGo=Math.min(G.toGo,100-G.yl);const los=G.los=wy(G.yl);
  G.qb={x:120,y:los+26};G.t=0;G.ball=null;G.car=null;
  G.rc=[[34,2,1],[206,2,-1],[160,12,-1]].map(([x,d,s])=>mkRoute(x,los+d,s));
  G.df=[80,105,135,160].map(x=>({x,y:los-6,t:'r'}))
    .concat(G.rc.map((r,i)=>({x:r.x,y:los-30-i*3,t:'c',i}))).concat([{x:120,y:los-24,t:'s'}]);
  G.ph='pre';if(G.down==4)four()}
function snap(){G.msg='';G.ph='live';G.t=0;beep(220,.06)}
function four(){G.ph='four';const d=100-G.yl+17,can=d<=58;
  OV.innerHTML=`<div class=p><h2>4th &amp; ${G.toGo}</h2><button onclick="go4(0)">GO FOR IT</button><br><button onclick="go4(1)" ${can?'':'disabled'}>FIELD GOAL (${d} yd)</button><br><button onclick="go4(2)">PUNT</button></div>`}
function go4(k){OV.innerHTML='';if(k==0){G.ph='pre';return}
  let m,p=0;G.clock-=8;
  if(k==1){const d=100-G.yl+17,pr=cl(.97-(d-20)*.017+S.up.kk*.05,.05,.97);
    if(R()<pr){G.me+=3;beep(660,.3);m='FIELD GOAL IS GOOD! +3';p=oppDrive(.8)}else{m='FIELD GOAL MISSED!';p=oppDrive(1)}}
  else{m='PUNT';p=oppDrive(.5)}
  flip(m,p)}
function oppDrive(m=1){if(R()<(.4+.07*G.o-.05*S.up.df)*m){const p=R()<.55?7:3;G.op+=p;return p}return 0}
function flip(m,p){G.yl=25;G.down=1;G.toGo=10;G.msg=m+(p?'  OPP SCORES '+p:'');G.ph='dead';G.mt=2}
function td(){G.me+=7;beep(880,.3);G.clock-=5;flip('TOUCHDOWN! +7',oppDrive(.8))}
function turnover(m){G.clock-=4;flip(m,oppDrive(1));beep(150,.3)}
function endPlay(y,msg,inc){
  G.clock-=inc?2:6;G.ph='dead';G.mt=1.4;
  const gain=inc?0:Math.round((G.los-y)/YD);G.yl=cl(G.yl+gain,1,99);
  if(!inc&&gain>=G.toGo){G.down=1;G.toGo=Math.min(10,100-G.yl);msg+=' FIRST DOWN!';beep(700)}
  else{G.toGo-=gain;G.down++;if(G.down>4)return turnover('TURNOVER ON DOWNS')}
  G.msg=inc?msg:msg+' ('+(gain>0?'+':'')+gain+')'}
function nxt(){
  if(G.clock<=0){G.q++;if(G.q>4)return gameOver();G.clock=75;G.msg='END OF Q'+(G.q-1)+(G.q==3?' - HALFTIME':'')}
  else G.msg='';
  setup()}
function gameOver(){
  let ot='';if(G.me==G.op){ot=' (OT)';R()<.5+S.up.qb*.03?G.me+=3:G.op+=3}
  const win=G.me>G.op;S.wk++;win?S.w++:S.l++;S.cr+=win?4:1;
  let sum='';if(S.wk>=8){sum=`<b>SEASON COMPLETE: ${S.w}-${S.l}</b><br>`;S.wk=0;S.w=0;S.l=0}
  save();const sc=`${win?'WIN':'LOSS'} ${G.me}-${G.op}${ot}`;G.ph='over';
  OV.innerHTML=`<div class=p><h2>FINAL</h2>${sc}<br>+${win?4:1} credits<br>${sum}<br><button onclick="hub()">CONTINUE</button></div>`}

/* ---------- actions ---------- */
function throwTo(i){if(!G||G.ph!='live')return;G.ph='air';G.ball={x:G.qb.x,y:G.qb.y,i,t:0};beep(300,.05)}
function juke(){if(G&&G.ph=='run'&&G.car.cd<=0){G.car.dash=.28;G.car.cd=1.6;beep(500,.06)}}
function runner(c,sp){Object.assign(c,{dx:0,dy:-1,cd:0,dash:0,vx:0,vy:-sp});G.car=c;G.ball=null;G.ph='run'}
function resolve(){
  const b=G.ball,r=G.rc[b.i];let dd=1e9;G.df.forEach(d=>dd=Math.min(dd,Math.hypot(d.x-r.x,d.y-r.y)));
  const pc=cl(.5+S.up.wr*.07+(dd-8)*.025,.12,.95);
  if(R()<pc){runner(r,58);beep(520)}
  else if(dd<14&&R()<.4)turnover('INTERCEPTED!');
  else{G.ball=null;endPlay(0,'INCOMPLETE',1)}}
function dirv(c){
  let x=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0),y=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);
  if(!x&&!y&&ptr.d){x=ptr.x-c.x;y=ptr.y-c.y;if(Math.hypot(x,y)<4)x=y=0}
  const m=Math.hypot(x,y);return m?[x/m,y/m]:[0,0]}
function mv(o,tx,ty,sp,dt){const dx=tx-o.x,dy=ty-o.y,d=Math.hypot(dx,dy)||1,s=Math.min(sp*dt,d);o.x+=dx/d*s;o.y+=dy/d*s;return d}

/* ---------- update ---------- */
function upd(dt){
  ptr.x=ptr.sx;ptr.y=ptr.sy+G.cam;
  G.cam+=(cl((G.car||G.ball||G.qb).y-250,0,FL-H)-G.cam)*Math.min(1,dt*6);
  if(G.ph=='dead'){G.mt-=dt;if(G.mt<=0)nxt();return}
  if(!['live','air','run'].includes(G.ph))return;
  G.t+=dt;G.clock-=dt;const o=G.o,dsp=44+o*2.5,rsp=56+S.up.wr*3,q=G.qb;
  G.rc.forEach(r=>{if(r===G.car||(r.stop&&r.i>=r.wp.length))return;
    const w=r.wp[Math.min(r.i,r.wp.length-1)];if(mv(r,w[0],w[1],rsp,dt)<3)r.i++});
  if(G.ph=='run'){
    const c=G.car,[x,y]=dirv(c);c.cd-=dt;if(x||y){c.dx=x;c.dy=y}
    const dash=c.dash>0,sp=dash?150:(c===q?50:58+S.up.wr*3);
    if(dash){c.dash-=dt;c.vx=c.dx*sp;c.vy=c.dy*sp}else{c.vx=x*sp;c.vy=y*sp}
    c.x=cl(c.x+c.vx*dt,16,224);c.y+=c.vy*dt;
    G.df.forEach(d=>mv(d,c.x+c.vx*.3,c.y+c.vy*.3,dsp*(d.t=='r'?.85:1),dt));
    if(c.y<=GOAL)return td();
    if(c.x<=17||c.x>=223)return endPlay(c.y,'OUT OF BOUNDS');
    if(!dash&&G.df.some(d=>Math.hypot(d.x-c.x,d.y-c.y)<6.5)){beep(120,.1);endPlay(c.y,'TACKLED')}
    return}
  G.df.forEach(d=>{
    if(d.t=='r'){if(G.t>.7)mv(d,q.x,q.y,12+o*2.5,dt)}
    else if(d.t=='c'){const r=G.rc[d.i];mv(d,r.x,r.y-5,dsp,dt)}
    else{G.t>2.4?mv(d,q.x,q.y,dsp*.7,dt):mv(d,q.x,G.los-24,30,dt)}});
  if(G.ph=='live'){
    const[x,y]=dirv(q);q.x=cl(q.x+x*48*dt,18,222);q.y=Math.min(q.y+y*48*dt,G.los+40);
    if(q.y<G.los-2){runner(q,48);return}
    if(G.df.some(d=>d.t!='c'&&Math.hypot(d.x-q.x,d.y-q.y)<7)){beep(120,.12);endPlay(q.y,'SACKED!')}
  }else{
    const b=G.ball,r=G.rc[b.i];b.t+=dt;
    const d=mv(b,r.x,(r.stop&&r.i>=r.wp.length)?r.y:r.y-8,170+S.up.qb*15,dt);
    if(d<4)resolve();else if(b.t>3.5){G.ball=null;endPlay(0,'INCOMPLETE',1)}}}

/* ---------- drawing ---------- */
const T=(s,x,y,c='#fff',a='left')=>{X.fillStyle=c;X.textAlign=a;X.fillText(s,x,y)};
const fmt=t=>{t=Math.max(0,Math.ceil(t));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
function pl(o,c,h){const x=Math.round(o.x),y=Math.round(o.y-G.cam);
  X.fillStyle='#0005';X.fillRect(x-3,y+3,7,2);X.fillStyle=c;X.fillRect(x-3,y-3,7,7);X.fillStyle=h;X.fillRect(x-2,y-6,5,4)}
function draw(){
  JK.style.display=G&&G.ph=='run'?'block':'none';
  X.font='bold 8px "Courier New",monospace';
  if(!G){X.fillStyle='#145014';X.fillRect(0,0,W,H);return}
  X.fillStyle='#0b300b';X.fillRect(0,0,W,H);
  for(let yd=0;yd<120;yd++){const y=yd*YD-G.cam;if(y>H||y<-YD)continue;
    X.fillStyle=yd<10?'#1d4f9c':yd>=110?'#9c2b1d':(Math.floor((yd-10)/5)%2?'#2e8b2e':'#349834');X.fillRect(16,y,208,YD);
    if(yd>=10&&yd<=110&&(yd-10)%5==0){X.fillStyle=(yd==10||yd==110)?'#fff':'#ffffff88';X.fillRect(16,y,208,(yd==10||yd==110)?2:1);
      const n=Math.min(110-yd,yd-10);if((yd-10)%10==0&&n>0){T(n+'',36,y+10,'#ffffffaa','center');T(n+'',204,y+10,'#ffffffaa','center')}}}
  X.fillStyle='#fff';X.fillRect(14,0,2,H);X.fillRect(224,0,2,H);
  X.fillStyle='#4af';X.fillRect(16,Math.round(G.los-G.cam),208,1);
  X.fillStyle='#fe3';X.fillRect(16,Math.round(G.los-G.toGo*YD-G.cam),208,1);
  G.df.forEach(d=>pl(d,'#e23','#900'));
  G.rc.forEach((r,i)=>{pl(r,'#fd4','#fff');if(G.ph=='live')T(i+1+'',Math.round(r.x),Math.round(r.y-G.cam)-9,'#fff','center')});
  pl(G.qb,'#39f','#fff');
  if(G.car){const x=Math.round(G.car.x),y=Math.round(G.car.y-G.cam);X.fillStyle='#fff';X.fillRect(x-5,y+5,11,1);X.fillStyle='#7a4a1a';X.fillRect(x+3,y-1,4,3)}
  if(G.ball){const x=Math.round(G.ball.x),y=Math.round(G.ball.y-G.cam);X.fillStyle='#0005';X.fillRect(x-2,y+4,5,2);X.fillStyle='#7a4a1a';X.fillRect(x-2,y-2,5,3);X.fillStyle='#fff';X.fillRect(x,y-1,1,1)}
  X.fillStyle='#000c';X.fillRect(0,0,W,13);X.fillRect(0,H-13,W,13);
  T(`YOU ${G.me}  ${G.op} ${TEAMS[S.wk%8].toUpperCase()}`,4,10);T(`Q${G.q} ${fmt(G.clock)}`,W-4,10,'#f5c400','right');
  const pos=G.yl<=50?'Own '+G.yl:'Opp '+(100-G.yl),dn=['1st','2nd','3rd','4th'][G.down-1]||'';
  T(`${dn} & ${G.toGo}  ${pos}`,4,H-4);
  T(G.ph=='pre'?'TAP / SPACE: SNAP':G.ph=='live'?'TAP A RECEIVER':G.ph=='run'?'RUN! SPACE: JUKE':'',W-4,H-4,'#f5c400','right');
  if(G.msg&&(G.ph=='dead'||G.ph=='pre')){const y=G.ph=='dead'?150:70;X.fillStyle='#000c';X.fillRect(0,y-12,W,20);T(G.msg,W/2,y+2,'#f5c400','center')}}

function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;if(G)upd(dt);draw();requestAnimationFrame(loop)}

/* ---------- input ---------- */
function scr(e){const r=C.getBoundingClientRect();ptr.sx=(e.clientX-r.left)*W/r.width;ptr.sy=(e.clientY-r.top)*H/r.height}
C.addEventListener('pointerdown',e=>{if(!G)return;scr(e);ptr.x=ptr.sx;ptr.y=ptr.sy+G.cam;
  if(G.ph=='pre')return snap();
  if(G.ph=='live'){let bi=-1,bd=30;G.rc.forEach((r,i)=>{const d=Math.hypot(r.x-ptr.x,r.y-ptr.y);if(d<bd){bd=d;bi=i}});
    if(bi>=0)return throwTo(bi)}
  ptr.d=true});
C.addEventListener('pointermove',e=>scr(e));
addEventListener('pointerup',()=>ptr.d=false);addEventListener('pointercancel',()=>ptr.d=false);
JK.addEventListener('pointerdown',e=>{e.stopPropagation();juke()});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;
  if(k.startsWith('arrow')||k==' ')e.preventDefault();
  if(!G)return;
  if(k==' '||k=='enter'){G.ph=='pre'?snap():juke()}
  if(['1','2','3'].includes(k))throwTo(+k-1)});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

hub();requestAnimationFrame(loop);
</script></body></html>
